spring.application.name=backend

# ===================================================================
# CONFIGURACIÓN DE BASE DE DATOS POSTGRESQL (LOCAL / CLOUD - NEON TECH)
# ===================================================================
# En tu máquina local: usa los valores por defecto del contenedor Docker (localhost:5432/appdb).
# En Render.com: lee las variables de entorno inyectadas (SPRING_DATASOURCE_URL, etc.).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:adminpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# CONFIGURACIÓN DE HIBERNATE / JPA
# ===================================================================
# 'update' asegura que al desplegar en Neon.tech se creen automáticamente las tablas y el DataSeeder inserte los datos iniciales.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# PUERTO DEL SERVIDOR (RENDER ASIGNA DINÁMICAMENTE LA VARIABLE PORT)
# ===================================================================
server.port=${PORT:8080}